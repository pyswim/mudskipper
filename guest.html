<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐟 机器鱼遥控器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #1a1e24;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #2d3436;
            border-radius: 32px;
            padding: 24px 20px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 24px;
            color: #dfe6e9;
            text-align: center;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #3d3f42;
            padding: 10px 16px;
            border-radius: 40px;
            margin-bottom: 20px;
            color: #b2bec3;
            font-size: 14px;
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #636e72;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .led.connected { background: #27ae60; box-shadow: 0 0 8px #27ae6088; }
        .led.disconnected { background: #e74c3c; }
        .device-name {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .status-msg {
            font-size: 13px;
            color: #fdcb6e;
            text-align: right;
            flex: 1;
            padding-left: 8px;
        }
        .connect-area {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }
        .connect-area button {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 40px;
            background: #0984e3;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .connect-area button:active { transform: scale(0.96); }
        .connect-area button:disabled { opacity: 0.5; pointer-events: none; }
        .connect-area button.danger { background: #e74c3c; }
        .connect-area button.secondary { background: #636e72; }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }
        .grid button {
            padding: 18px 6px;
            border: none;
            border-radius: 16px;
            background: #3d3f42;
            color: #dfe6e9;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 0 #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .grid button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1e1f22;
        }
        .grid button .icon { font-size: 28px; line-height: 1; }
        .grid button .label { font-size: 13px; opacity: 0.8; }
        .grid button.primary { background: #0984e3; }
        .grid button.success { background: #27ae60; }
        .grid button.warning { background: #f39c12; }
        .grid button.danger { background: #e74c3c; }
        .grid button.purple { background: #6c5ce7; }
        .grid button.teal { background: #00b894; }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 4px;
        }
        .row-2 button {
            padding: 14px 6px;
            border: none;
            border-radius: 16px;
            background: #3d3f42;
            color: #dfe6e9;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 0 #1e1f22;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .row-2 button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1e1f22;
        }
        .row-2 button .icon { font-size: 22px; }

        .footer {
            margin-top: 18px;
            font-size: 12px;
            color: #636e72;
            text-align: center;
            border-top: 1px solid #3d3f42;
            padding-top: 14px;
        }
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #3d3f42;
            padding: 8px 14px;
            border-radius: 30px;
            margin-top: 12px;
            color: #b2bec3;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .options-row label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .options-row select {
            background: #2d3436;
            color: #dfe6e9;
            border: 1px solid #636e72;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="container">
    <h1>🐟 机器鱼遥控器</h1>

    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-left">
            <span class="led" id="ledStatus"></span>
            <span class="device-name" id="deviceName">未连接</span>
        </div>
        <span class="status-msg" id="statusMsg">就绪</span>
    </div>

    <!-- 连接区 -->
    <div class="connect-area">
        <button id="connectBtn">🔗 连接蓝牙</button>
        <button id="disconnectBtn" class="danger hidden">断开</button>
    </div>

    <!-- 方向控制 + 常用动作 (3x3) -->
    <div class="grid">
        <button data-cmd="turnleft" class="warning">
            <span class="icon">↺</span>
            <span class="label">左转</span>
        </button>
        <button data-cmd="crawl" class="primary">
            <span class="icon">⬆</span>
            <span class="label">前进</span>
        </button>
        <button data-cmd="turnright" class="warning">
            <span class="icon">↻</span>
            <span class="label">右转</span>
        </button>

        <button data-cmd="tail" class="teal">
            <span class="icon">🦎</span>
            <span class="label">尾巴摆动</span>
        </button>
        <button data-cmd="stop" class="danger">
            <span class="icon">⏹</span>
            <span class="label">停止</span>
        </button>
        <button data-cmd="pswim" class="purple">
            <span class="icon">🐟</span>
            <span class="label">胸鳍游动</span>
        </button>

        <button data-cmd="reset" class="secondary">
            <span class="icon">🔄</span>
            <span class="label">复位</span>
        </button>
        <button data-cmd="start" class="success">
            <span class="icon">▶</span>
            <span class="label">激活</span>
        </button>
        <div></div> <!-- 占位 -->
    </div>

    <!-- 选项（保留必要设置） -->
    <div class="options-row">
        <label><input type="checkbox" id="appendNewline" checked> 自动换行</label>
        <label>写入:
            <select id="writeType">
                <option value="withResponse">带响应</option>
                <option value="withoutResponse">无响应</option>
            </select>
        </label>
    </div>

    <div class="footer">
        ⚡ 蓝牙 BLE · 仅搜索 HC-05 · 点击按钮即发送指令
    </div>
</div>

<script>
    (function() {
        // ============================================================
        // 1. DOM 引用
        // ============================================================
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const ledStatus = document.getElementById('ledStatus');
        const deviceName = document.getElementById('deviceName');
        const statusMsg = document.getElementById('statusMsg');
        const appendNewline = document.getElementById('appendNewline');
        const writeType = document.getElementById('writeType');

        // ============================================================
        // 2. 指令定义（与之前完全一致）
        // ============================================================
        const COMMANDS = {
            crawl: `START
LOOP
30 150 90 90 45 2.0
30 150 30 150 45 2.0
90 90 30 150 45 2.0
90 90 90 90 45 2.0`,
            tail: `START
LOOP
90 90 120 60 60 1.0
90 90 120 60 30 1.0`,
            pswim: `START
LOOP
90 90 150 30 45 1
90 90 90 90 45 1`,
            turnleft: `START
LOOP
120 160 120 60 45 2.5
120 160 120 120 45 2.5
120 90 120 120 45 2.5
120 90 30 60 80 4.0
30 160 120 60 45 2.5`,
            turnright: `START
LOOP
20 50 120 60 45 2.5
20 50 30 60 45 2.5
90 50 30 60 45 2.5
90 50 120 150 10 4.0
60 150 120 60 45 2.5`,
            reset: 'RESET',
            stop: 'STOP',
            start: 'START'
        };

        // ============================================================
        // 3. 蓝牙相关状态
        // ============================================================
        let bleDevice = null;
        let bleServer = null;
        let bleService = null;
        let bleTxChar = null;
        let bleRxChar = null;
        let bleNotifyListener = null;
        let isConnected = false;

        // 固定 UUID (HC-05 BLE)
        const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
        const CHAR_FFE1 = '0000ffe1-0000-1000-8000-00805f9b34fb';
        const CHAR_FFE2 = '0000ffe2-0000-1000-8000-00805f9b34fb';

        // ============================================================
        // 4. 界面更新
        // ============================================================
        function setStatus(msg, isError = false) {
            statusMsg.textContent = msg;
            statusMsg.style.color = isError ? '#e74c3c' : '#fdcb6e';
        }

        function setConnected(connected, name = '') {
            isConnected = connected;
            ledStatus.className = 'led ' + (connected ? 'connected' : 'disconnected');
            deviceName.textContent = connected ? (name || 'HC-05') : '未连接';
            connectBtn.textContent = connected ? '已连接' : '🔗 连接蓝牙';
            connectBtn.disabled = connected;
            disconnectBtn.classList.toggle('hidden', !connected);
            if (connected) {
                setStatus('就绪', false);
            } else {
                setStatus('未连接', false);
            }
        }

        // ============================================================
        // 5. 蓝牙连接 / 断开（过滤 HC-05）
        // ============================================================
        async function scanAndConnect() {
            if (!navigator.bluetooth) {
                setStatus('浏览器不支持 Web Bluetooth', true);
                return;
            }
            try {
                setStatus('正在扫描 HC-05...', false);
                // 请求设备，过滤名称
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: false,
                    filters: [{ name: 'HC-05' }],   // 精确匹配
                    optionalServices: [SERVICE_UUID]
                });
                // 如果用户选择了，但名称不是 HC-05（理论上不会），但以防万一
                if (device.name && device.name.toUpperCase() !== 'HC-05') {
                    setStatus('请选择 HC-05 设备', true);
                    return;
                }
                bleDevice = device;
                setStatus('正在连接...', false);
                await connectBle();
            } catch (err) {
                if (err.message.includes('cancelled')) {
                    setStatus('用户取消', false);
                } else {
                    setStatus('扫描/连接失败: ' + err.message, true);
                }
                setConnected(false);
            }
        }

        async function connectBle() {
            if (!bleDevice) {
                setStatus('未选择设备', true);
                return;
            }
            try {
                bleServer = await bleDevice.gatt.connect();
                bleService = await bleServer.getPrimaryService(SERVICE_UUID);
                const chars = await bleService.getCharacteristics();

                // 查找特征
                bleRxChar = null;
                bleTxChar = null;
                for (const char of chars) {
                    const uuid = char.uuid.toLowerCase();
                    if (uuid === CHAR_FFE1 || (char.properties.notify && char.properties.write)) {
                        bleRxChar = char;
                    }
                    if (uuid === CHAR_FFE2 || (char.properties.write && !char.properties.notify)) {
                        bleTxChar = char;
                    }
                    if (bleRxChar && bleTxChar) break;
                }
                // 备选：取第一个通知和第一个写
                if (!bleRxChar) {
                    for (const char of chars) {
                        if (char.properties.notify || char.properties.indicate) {
                            bleRxChar = char;
                            break;
                        }
                    }
                }
                if (!bleTxChar) {
                    for (const char of chars) {
                        if (char.properties.write || char.properties.writeWithoutResponse) {
                            bleTxChar = char;
                            break;
                        }
                    }
                }

                if (!bleRxChar) setStatus('警告: 未找到通知特征', true);
                if (!bleTxChar) setStatus('警告: 未找到写入特征', true);

                // 启用通知（可选，但不需要显示，仅保持连接活跃）
                if (bleRxChar) {
                    await bleRxChar.startNotifications();
                    bleNotifyListener = (event) => {
                        // 不处理接收，只维持连接
                    };
                    bleRxChar.addEventListener('characteristicvaluechanged', bleNotifyListener);
                }

                bleDevice.addEventListener('gattserverdisconnected', () => {
                    if (isConnected) {
                        setStatus('设备断开', true);
                        setConnected(false);
                    }
                });

                setConnected(true, bleDevice.name || 'HC-05');
                setStatus('连接成功', false);
            } catch (err) {
                setStatus('连接失败: ' + err.message, true);
                setConnected(false);
                throw err;
            }
        }

        async function disconnectBle() {
            if (bleRxChar && bleNotifyListener) {
                bleRxChar.removeEventListener('characteristicvaluechanged', bleNotifyListener);
                bleNotifyListener = null;
                try { await bleRxChar.stopNotifications(); } catch(e) {}
            }
            if (bleDevice && bleDevice.gatt) {
                try { bleDevice.gatt.disconnect(); } catch(e) {}
            }
            bleDevice = null;
            bleServer = null;
            bleService = null;
            bleRxChar = null;
            bleTxChar = null;
            setConnected(false);
            setStatus('已断开', false);
        }

        // ============================================================
        // 6. 发送指令（逐行）
        // ============================================================
        async function sendLine(line) {
            let toSend = line;
            if (appendNewline.checked && !toSend.endsWith('\n')) {
                toSend += '\n';
            }
            if (!bleTxChar) {
                throw new Error('蓝牙无写入特征');
            }
            const dataBytes = new TextEncoder().encode(toSend);
            if (writeType.value === 'withResponse') {
                await bleTxChar.writeValueWithResponse(dataBytes);
            } else {
                await bleTxChar.writeValueWithoutResponse(dataBytes);
            }
        }

        async function sendContent(content) {
            if (!isConnected) {
                setStatus('请先连接', true);
                return false;
            }
            if (!content || !content.trim()) return false;

            const lines = content.split('\n').map(line => line.trim()).filter(line => line !== '');
            if (lines.length === 0) return false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                try {
                    await sendLine(line);
                } catch (err) {
                    setStatus(`发送失败 (行${i+1}): ${err.message}`, true);
                    return false;
                }
                // 微小延时
                await new Promise(resolve => setTimeout(resolve, 20));
            }
            setStatus(`指令已发送 (${lines.length} 行)`, false);
            return true;
        }

        // ============================================================
        // 7. 按钮事件绑定
        // ============================================================
        function setupCommandButtons() {
            document.querySelectorAll('[data-cmd]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const cmdKey = btn.dataset.cmd;
                    const content = COMMANDS[cmdKey];
                    if (content) {
                        await sendContent(content);
                    } else {
                        setStatus('未知指令', true);
                    }
                });
            });
        }

        // ============================================================
        // 8. 连接/断开按钮
        // ============================================================
        connectBtn.addEventListener('click', scanAndConnect);
        disconnectBtn.addEventListener('click', async () => {
            await disconnectBle();
        });

        // ============================================================
        // 9. 初始化
        // ============================================================
        setConnected(false);
        setupCommandButtons();

        if (!('bluetooth' in navigator)) {
            setStatus('浏览器不支持 Web Bluetooth', true);
            connectBtn.disabled = true;
        }

        // 页面关闭时断开
        window.addEventListener('beforeunload', () => {
            if (bleDevice && bleDevice.gatt) {
                try { bleDevice.gatt.disconnect(); } catch(e) {}
            }
        });

        console.log('极简遥控器已启动');
    })();
</script>
</body>
</html>
